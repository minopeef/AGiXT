apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agixt-ingress
  namespace: agixt
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: api.agixt.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: agixt-api
            port:
              number: 7437
  - host: app.agixt.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: agixt-interactive
            port:
              number: 3437 